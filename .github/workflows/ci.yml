name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No job writes to the repository or calls its API, so the token is read-only whatever the repository's default is.
permissions:
  contents: read

jobs:
  store:
    name: Store tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasan8 libubsan1

      - name: Run store tests
        run: scripts/test-store.sh quick

      - name: Build and run OOM injection tests
        run: |
          mkdir -p build
          gcc -Wall -Wextra -std=gnu11 -O1 -g -DOOM_INJECT -DFK_MAX_BRANCHES=64 \
            -Istore -Itest test/oom_test.c store/fkstore.c store/io_file.c \
            store/io_prealloc.c -lpthread -lm -o build/oom_test
          build/oom_test

      - name: Build and run corrupt-record recovery tests
        run: |
          mkdir -p build
          gcc -Wall -Wextra -std=gnu11 -O1 -g -DFK_MAX_BRANCHES=64 \
            -Istore -Itest test/corrupt_test.c store/fkstore.c store/io_file.c \
            store/io_prealloc.c -lpthread -lm -o build/corrupt_test
          build/corrupt_test

  vfs:
    name: VFS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasan8 libubsan1

      - name: Run VFS tests
        run: scripts/test-vfs.sh quick

  fkx:
    name: fkx tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasan8 libubsan1 python3

      - name: Run fkx tests
        run: scripts/test-fkx.sh quick

  windows:
    name: Windows store tests
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and run store smoke test
        run: |
          if not exist build mkdir build
          gcc -Wall -Wextra -std=gnu11 -O2 -Istore test\win_smoke.c store\fkstore.c store\io_file.c store\io_file_win.c store\io_prealloc.c -o build\smoke_test.exe
          build\smoke_test.exe

      - name: Compaction smoke test (the compacted file replaces the log while it is open)
        run: |
          if not exist build mkdir build
          gcc -Wall -Wextra -std=gnu11 -O2 -Istore -DFK_COUNT_FLUSH -include test\win_flush_redirect.h -c store\io_file_win.c -o build\io_file_win_counted.o
          gcc -Wall -Wextra -std=gnu11 -O2 -Istore -DFK_COUNT_FLUSH test\compact_smoke.c store\fkstore.c store\io_file.c store\io_prealloc.c build\io_file_win_counted.o -o build\compact_smoke.exe
          build\compact_smoke.exe

      - name: Lock and path smoke test (the single-opener lock survives a compaction, and a store keeps its place when the process changes directory)
        run: |
          if not exist build mkdir build
          gcc -Wall -Wextra -std=gnu11 -O2 -Istore test\lock_smoke.c store\fkstore.c store\io_file.c store\io_file_win.c store\io_prealloc.c -o build\lock_smoke.exe
          build\lock_smoke.exe

  macos:
    name: macOS store tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run store tests (no sanitizers)
        run: |
          scripts/test-store.sh quick

  pysqlite:
    name: Python SQLite VFS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system SQLite
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      - name: Build VFS test against system SQLite
        run: |
          mkdir -p build
          gcc -Wall -Wextra -std=gnu11 -O2 \
            -DFK_TEST_HOOKS -Istore -Ivfs -Itest \
            vfs/fkvfs.c store/fkstore.c store/io_file.c store/io_prealloc.c \
            test/simdisk.c test/file_test.c \
            -lsqlite3 -lpthread -lm -o build/pysqlite_file_test
          build/pysqlite_file_test

  extension:
    name: Extension tests (Python sqlite3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the loadable extension and test it from Python's sqlite3
        run: scripts/test-ext.sh

  extension-node:
    name: Extension tests (Node node:sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Build the loadable extension and test it from Node's built-in SQLite
        run: scripts/test-ext-node.sh

  extension-bsq:
    name: Extension tests (better-sqlite3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install the pinned better-sqlite3 and test the loadable extension from it
        run: scripts/test-ext-bsq.sh

  extension-portable:
    name: Extension tests (${{ matrix.suite }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        suite: [node, bsq]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Build the loadable extension (.dylib on macOS, .dll on Windows) and test it from ${{ matrix.suite }}
        run: |
          uname -s
          gcc --version | head -1
          scripts/test-ext-${{ matrix.suite }}.sh

  nosync-bench:
    name: What nosync saves (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Time and durability calls per operation, durable against nosync (the table is in the job summary)
        run: scripts/bench-nosync.sh

  oldest-sqlite:
    name: Extension tests (SQLite 3.24.0, the oldest supported)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the extension; load it into SQLite 3.24.0 (it must work) and 3.23.1 (it must refuse)
        run: scripts/test-oldest-sqlite.sh

  fuzz:
    name: Recovery fuzzer (sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fuzz the open and recovery path (100000 inputs, address and undefined-behaviour sanitizers)
        run: FUZZ_INPUTS=100000 scripts/test-fuzz.sh mutants

  cli:
    name: CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test the CLI
        run: scripts/test-cli.sh

  threads:
    name: Thread tests (ThreadSanitizer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run thread stress tests
        run: scripts/test-threads.sh

  pytest-example:
    name: pytest example (a branch per test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the extension, run the example's suite and its isolation canaries
        run: scripts/test-pytest-example.sh

  release-scripts:
    name: Release script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the tag guard, the release notes and the packaging script
        run: scripts/test-release.sh
